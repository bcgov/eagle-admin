<div class="container">
  <div class="col-md-6 col-md-offset-3">
    <h2>Restricted environment</h2>
    <p>This is a non-production EPIC environment. Enter the shared password to continue.</p>
    <form (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="gate-password">Password</label>
        <input #passwordInput id="gate-password" name="password" type="password" class="form-control"
          autocomplete="current-password" [(ngModel)]="password" required />
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary" [disabled]="busy() || !password">Continue</button>
      </div>
      @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
      }
    </form>
  </div>
</div>

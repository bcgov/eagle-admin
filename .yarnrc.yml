nodeLinker: node-modules

enableGlobalCache: true

# Suppress expected peer dependency warnings
logFilters:
  - code: YN0086
    level: discard

# GitHub Packages wants a token even for a public package: a PAT with read:packages locally,
# the GH_PACKAGES_TOKEN repository secret in CI.
npmScopes:
  digitalspace:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
    npmAuthToken: "${GH_PACKAGES_TOKEN:-}"

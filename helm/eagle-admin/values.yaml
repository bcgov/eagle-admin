# Default values for eagle-admin
# Override in values-{env}.yaml for environment-specific settings

replicaCount: 2

image:
  repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-admin
  pullPolicy: Always
  tag: "latest"
  # For OpenShift ImageStreamTag trigger
  name: eagle-admin
  namespace: 6cdc9e-tools

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

route:
  # OFF BY DEFAULT, and the default is the safety. Production is the one environment where a route
  # from this chart is never right — `prod-external` already serves that host through rproxy and
  # carries its certificate — so prod must not have to remember to opt out. dev and test opt IN.
  enabled: false
  host: ""  # Set in values-{env}.yaml
  path: "/admin/"
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Second Route, straight to this chart's own Service, so Azure Front Door can reach eagle-admin
# without going through rproxy. Off by default for the same reason as route.enabled above.
directRoute:
  enabled: false
  host: ""  # Set in values-{env}.yaml

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Liveness and readiness probes
probes:
  liveness:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 60
    failureThreshold: 3
  readiness:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 60
    failureThreshold: 3

# Environment variables passed to the container
# Container environment variables (optional, not used by Angular)
# Angular reads config from /api/config, not container env vars
env: {}

# env.js ConfigMap - mount external ConfigMap to override built-in env.js
# Set configMap name to use existing ConfigMap, leave empty to use container's built-in env.js
# ConfigMap should only contain: configEndpoint=true and KEYCLOAK_CLIENT_ID
# All other config fetched at runtime from /api/config (served by nginx from rproxy-config)
envJs:
  configMap: ""  # e.g., "eagle-admin-env-js"

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

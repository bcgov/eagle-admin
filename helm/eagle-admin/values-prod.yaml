# Production environment values
replicaCount: 2

image:
  tag: "prod"

route:
  enabled: true
  serviceName: rproxy
  targetPort: "8080-tcp"
  host: projects.eao.gov.bc.ca
  path: "/admin/"

resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Pod Disruption Budget - ensure at least 1 pod during disruptions
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Mount existing ConfigMap for env.js
# Contains configEndpoint=true and KEYCLOAK_CLIENT_ID
# All other config comes from /api/config (served by nginx from rproxy-config ConfigMap)
envJs:
  configMap: "eagle-admin-env-js"

# Production environment values
replicaCount: 2

image:
  tag: "prod"

route:
  # Disabled, for the same reason as eagle-api and eagle-public. This chart rendered a Route for
  # host projects.eao.gov.bc.ca with path "/admin/" and NO `tls.certificate`, while `prod-external`
  # already serves that host through rproxy and holds the Entrust certificate for it. Host and path
  # differ as strings, so both routes would be admitted and the public site's HTTPS could be served
  # by the router's default certificate.
  #
  # eagle-api hit the other half of this on 2026-08-20: `helm upgrade` aborted on Route ownership
  # while the Deployment's OpenShift image trigger rolled the image anyway — a release that reports
  # failure and changes production regardless.
  #
  # `host` and `path` are deliberately not left behind: flipping `enabled` back would otherwise
  # silently re-create the certless route.
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Pod Disruption Budget - ensure at least 1 pod during disruptions
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Mount existing ConfigMap for env.js
# Contains configEndpoint=true and KEYCLOAK_CLIENT_ID
# All other config comes from /api/config (served by nginx from rproxy-config ConfigMap)
envJs:
  configMap: "eagle-admin-env-js"
